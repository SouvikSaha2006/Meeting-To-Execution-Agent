services:
  - type: web
    name: veriflow-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./veriflow.db
      - key: DEMO_MODE
        value: "false"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
