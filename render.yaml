services:
  - type: web
    name: vela-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./vela.db
      - key: DEMO_MODE
        value: "false"
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
